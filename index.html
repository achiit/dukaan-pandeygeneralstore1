<head>

<meta name="description" content="Pandey Granel Store — मसाले, किराना और घर का बना देसी घी। काशी राम कॉलोनी, सेकंड गेट, बिल्डिंग नंबर 7।">
<title>Pandey Granel Store | मसाले और किराना</title>
<style>
:root{--ink:#29251f;--muted:#6d6255;--cream:#fffaf0;--paper:#fffdf8;--saffron:#bd6b28;--gold:#e5b65d;--green:#345b43;--line:#eadfce}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--cream);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans Devanagari",Arial,sans-serif;line-height:1.6}
a{color:inherit}.wrap{width:min(1100px,92%);margin:auto}
header{background:#fffdf8;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.nav{min-height:72px;display:flex;align-items:center;justify-content:space-between;gap:18px}
.brand{font-weight:850;font-size:1.12rem;letter-spacing:.2px}.brand span{color:var(--saffron)}
.navlinks{display:flex;gap:22px;font-size:.93rem}.navlinks a{text-decoration:none;color:var(--muted)}
.hero{padding:48px 0 54px;background:radial-gradient(ellipse at 85% 10%,#f4dfb9 0,transparent 38%),linear-gradient(135deg,#fffaf0,#f7ead5)}
.hero-grid{display:grid;grid-template-columns:1.02fr .98fr;align-items:center;gap:36px}
.eyebrow{color:var(--green);font-weight:750;letter-spacing:1.5px;font-size:.82rem;text-transform:uppercase}
h1{font-size:clamp(2.3rem,5vw,4.4rem);line-height:1.08;margin:12px 0 18px;letter-spacing:-1.5px}
h1 em{font-style:normal;color:var(--saffron)}
.lead{font-size:1.12rem;color:var(--muted);max-width:560px}
.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:26px}
.btn{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;border-radius:999px;padding:12px 20px;font-weight:750;border:1px solid var(--green)}
.primary{background:var(--green);color:white}.secondary{background:transparent;color:var(--green)}
.photo{border:9px solid #fffdf8;border-radius:24px;overflow:hidden;box-shadow:0 18px 50px #60421b26;transform:rotate(1deg)}
.photo img{display:block;width:100%;height:390px;object-fit:cover;object-position:center 55%}
.section{padding:64px 0}.section-head{text-align:center;max-width:680px;margin:0 auto 32px}
h2{font-size:clamp(1.8rem,3vw,2.5rem);line-height:1.2;margin:0 0 10px}
.sub{color:var(--muted);margin:0}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:24px;box-shadow:0 8px 25px #4b35100a}
.symbol{width:48px;height:48px;display:grid;place-items:center;border-radius:15px;background:#f6e8d0;font-size:1.45rem;margin-bottom:16px}
.card h3{margin:0 0 8px;font-size:1.15rem}.card p{color:var(--muted);margin:0}
.price{font-size:1.5rem;color:var(--green);font-weight:850;margin-top:14px}
.note{font-size:.84rem;color:var(--muted);margin-top:5px}
.story{background:#f2e6d3}.story-grid{display:grid;grid-template-columns:1fr 1fr;gap:35px;align-items:center}
.fact{display:flex;gap:14px;align-items:center;margin:18px 0}.fact strong{font-size:2.2rem;color:var(--saffron);line-height:1}
.quote{font-size:1.3rem;font-weight:750;color:var(--green);border-left:4px solid var(--gold);padding:6px 0 6px 18px;margin:22px 0}
.contact-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.contact-item{padding:18px;border:1px solid var(--line);border-radius:15px;background:var(--paper)}
.contact-item small{display:block;color:var(--muted);margin-bottom:4px}
.contact-item a{text-decoration:none;font-weight:700;overflow-wrap:anywhere}
footer{background:#282b23;color:#f9f1e4;padding:28px 0}
footer .wrap{display:flex;justify-content:space-between;gap:18px;flex-wrap:wrap}
footer p{margin:0;color:#d8cebd;font-size:.9rem}
.floating{position:fixed;right:18px;bottom:18px;background:#1f9d55;color:white;text-decoration:none;border-radius:999px;padding:13px 18px;font-weight:800;box-shadow:0 8px 25px #0003;z-index:8}
@media(max-width:760px){.navlinks{display:none}.hero{padding:34px 0}.hero-grid,.story-grid{grid-template-columns:1fr}.photo img{height:270px}.cards{grid-template-columns:1fr}.section{padding:48px 0}.contact-grid{grid-template-columns:1fr}.hero-grid{gap:26px}}
</style>
</head>
